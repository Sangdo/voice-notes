name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['voice_notes/**', 'packaging/**', 'requirements.txt', '.github/workflows/build.yml']

permissions:
  contents: write   # publish the installer as a release

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.10"

      # Full FFmpeg build (GPL, all codecs) for converting any recording to WAV.
      - name: Get FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          New-Item -ItemType Directory -Force packaging/ffmpeg | Out-Null
          Get-ChildItem ffmpeg-dl -Recurse -Include ffmpeg.exe, ffprobe.exe | Copy-Item -Destination packaging/ffmpeg
          Get-ChildItem packaging/ffmpeg

      - name: Build app
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: python packaging/build.py

      - name: Self-test the bundle
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Voice Notes/Voice Notes.exe" -ArgumentList "--selftest" `
               -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest.txt -RedirectStandardError selftest-err.txt
          Get-Content selftest.txt, selftest-err.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=1.0.${{ github.run_number }}" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist\VoiceNotes-Setup.exe | Format-List Name, Length

      # Install for real, then install again over it (an update), and self-test the installed copy.
      - name: Test install and update
        shell: pwsh
        run: |
          foreach ($round in 1, 2) {
            $p = Start-Process dist\VoiceNotes-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
            if ($p.ExitCode -ne 0) { Write-Error "install $round failed: $($p.ExitCode)"; exit 1 }
          }
          $exe = "$env:LOCALAPPDATA\Programs\Voice Notes\Voice Notes.exe"
          $p = Start-Process $exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow -RedirectStandardOutput installed.txt
          Get-Content installed.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "v1.0.${{ github.run_number }}"
          $notes = "Windows: download VoiceNotes-Setup.exe and run it, or use Help > Check for Updates in the app. Installing over an older version updates it; models, settings and notes are kept."
          gh release create $version dist\VoiceNotes-Setup.exe --target ${{ github.sha }} --title "Voice Notes $version" --notes $notes
